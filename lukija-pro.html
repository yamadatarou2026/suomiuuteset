  .btn:active{transform:translateY(1px)}

  .article h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.3rem;margin:1.3em 0 .35em;color:var(--accent-d)}
  .article h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.12rem;margin:1.1em 0 .3em}

  .base{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:600}
  .row{padding:8px 0;border-top:1px solid var(--line)}

  .vcard{background:#fbf8f1;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-top:18px}

<body>
<div class="wrap">
  <div class="chip">SUOMEN KIELI · 精読</div>
  <h1>lukija</h1>
  <p class="sub">フィンランド語のニュースURLを貼って、わからない単語をクリック。原形・格・訳がその場で出ます。</p>

  <div class="tabs">
    <button class="tab active" data-tab="reading">リーディング</button>
    <button class="tab" data-tab="helper">画像ヘルパー</button>
  </div>

  <div id="readingPanel">
  <div class="bar">
    <input id="url" type="url" placeholder="https://yle.fi/a/… の記事URLを貼る" />
    <button id="go" class="btn btn-primary">取り込む</button>
  </div>

  <div id="picker" class="picker">
    <div class="picker-head">読むものを選ぶ</div>
    <div id="srcChips" class="chips"></div>
    <div id="srcBody" class="picker-body"></div>
  </div>

  <span id="pasteToggle" class="toggle">▾ 直接テキストを貼る（URLで取れないサイト用）</span>
  <div id="pasteWrap" class="paste-wrap" style="display:none">
    <textarea id="paste" rows="6" placeholder="記事本文をここに貼り付け…"></textarea>
    <button id="goPaste" class="btn btn-ghost" style="margin-top:10px">このテキストで読む</button>
  </div>

  <div id="status" class="status" style="display:none"></div>

  <div id="articleCard" class="card" style="display:none">
    <div id="article" class="article"></div>
  </div>

  <div id="detail"></div>

  <div id="vcard" class="vcard" style="display:none">
    <div class="vhead">
      <span class="chip">単語帳</span>
      <div>
        <button id="anki" class="btn btn-ghost" style="padding:6px 12px;font-size:.78rem">Anki用に書き出し</button>
        <button id="clearVocab" class="btn btn-ghost" style="padding:6px 12px;font-size:.78rem">空にする</button>
      </div>
    </div>
    <div id="vstats" class="vstats"></div>
    <div id="vlist"></div>
  </div>

  </div><!-- /#readingPanel -->

  <div id="helperPanel" style="display:none">
    <div class="card">
      <div class="img-drop" id="imgDrop">
        <input type="file" id="imgFile" accept="image/*" capture="environment">
        <label for="imgFile">
          <span class="img-icon">📷</span>
          <span>タップして写真を選ぶ（スマホカメラも可）</span>
          <span class="img-hint">PNG・JPEG・HEIC など。自動でJPEGに縮小します。</span>
        </label>

      </div>

  <div class="foot">lukija · 単語帳はこの端末に保存されます（localStorage）</div>

<script>
/* ═══════════ ① 設定：GASの /exec URL を貼り替える ═══════════ */
const PROXY = "https://script.google.com/macros/s/AKfycbzL6k4NCy0Jkq-zbRmWdCq0mOHiuDoTJ8l8b40ngSlAgpgFzZ2oplgiDL80Cb3BcADN2w/exec";
/* ════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
let marked = {};        // 現在の記事内: surface(lower) -> {status,data,surface,sentence}
let selectedKey = null;
let vocab = loadVocab(); // 永続単語帳: [{perusmuoto,contextMeaning,...}]

/* ---------- 取り込み（URL → プロキシ → Readability） ---------- */
async function importFromUrl(url) {
  setStatus("ページを取得中…", true);
  try {
    const html = await fetch(PROXY + "?url=" + encodeURIComponent(url)).then(r => r.text());
    if (html.startsWith("ERROR:")) throw new Error(html);
    const doc = new DOMParser().parseFromString(html, "text/html");
    const parsed = new Readability(doc).parse();
    if (!parsed || !parsed.textContent || parsed.textContent.trim().length < 40) {
      throw new Error("本文をうまく抽出できませんでした");
    }
    setStatus("", false);
    renderArticle(parsed.content, true);
  } catch (e) {
    setStatus("取り込み失敗：" + e.message + " — 下の「直接テキストを貼る」をお試しください。", false, true);
  }
}

/* ---------- 記事描画（構造を残して単語をクリック可能に） ---------- */
function renderArticle(input, isHTML) {
  marked = {}; selectedKey = null; $("detail").innerHTML = "";
  const a = $("article"); a.innerHTML = "";
  const root = document.createElement("div");

  if (isHTML) {
    root.innerHTML = input; // Readabilityの整形済みHTML
    // 不要な要素を除去（画像・キャプション・埋め込みなど）
    root.querySelectorAll("img,figure,figcaption,picture,svg,video,iframe,button,nav,aside,form").forEach(n => n.remove());
  } else {
    // 貼り付けテキスト：空行で段落に分ける
    input.split(/\n\s*\n|\n/).filter(s => s.trim()).forEach(par => {
      const p = document.createElement("p"); p.textContent = par.trim(); root.appendChild(p);
    });
  }

  wrapWords(root);
  while (root.firstChild) a.appendChild(root.firstChild);
  $("articleCard").style.display = "block";
}

// テキストノードを走査し、単語を <span class="w"> で包む（見出し・段落構造は保持）
function wrapWords(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = []; let n;
  while ((n = walker.nextNode())) nodes.push(n);
  nodes.forEach((node) => {
    const block = (node.parentElement && node.parentElement.closest("p,h1,h2,h3,h4,li,blockquote")) || node.parentElement;
    const context = (block ? block.textContent : node.nodeValue).trim();
    const parts = tokenize(node.nodeValue);
    if (!parts.some(p => p.w)) return; // 単語が無ければそのまま
    const frag = document.createDocumentFragment();
    parts.forEach((p) => {
      if (!p.w) { frag.appendChild(document.createTextNode(p.t)); return; }
      const span = document.createElement("span");
      span.className = "w"; span.textContent = p.t;
      span.onclick = () => handleWord(p.t, context, span);
      frag.appendChild(span);
    });
    node.parentNode.replaceChild(frag, node);
  });
}

function tokenize(text) {
  const parts = []; const re = /[\p{L}][\p{L}\p{M}'’-]*/gu; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push({ t: text.slice(last, m.index), w: false });
    parts.push({ t: m[0], w: true }); last = m.index + m[0].length;
  }
  if (last < text.length) parts.push({ t: text.slice(last), w: false });
  return parts;
}

/* ---------- 単語クリック → 分析（プロキシ経由） ---------- */
async function handleWord(surface, sentence, span) {
  const key = surface.toLowerCase();
  highlightSelected(key);
  if (marked[key] && marked[key].status === "done") { showDetail(key); return; }

  marked[key] = { status: "loading", surface, sentence };
  paintWord();
  showDetail(key);
  try {
    const res = await fetch(PROXY, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // ← preflight回避
      body: JSON.stringify({ word: surface, sentence: sentence.trim() }),
    });
    const data = JSON.parse(await res.text());
    marked[key] = { status: "done", data, surface, sentence };
    addToVocab(data, surface);
  } catch (e) {
    marked[key] = { status: "error", surface, sentence };
  }
  paintWord(); showDetail(key);
}

function highlightSelected(key){ selectedKey = key; paintWord(); }
function paintWord() {
  document.querySelectorAll(".w").forEach((el) => {
    const k = el.textContent.toLowerCase();
    const m = marked[k];
    el.className = "w"
      + (m && m.status === "loading" ? " loading" : "")
      + (m && (m.status === "done" || m.status === "error") ? " marked" : "")
      + (selectedKey === k ? " selected" : "");
  });
}

/* ---------- ビジュアル用ヘルパー ---------- */
// 品詞(日本語/英語どちらでも)→ 色・絵文字・ラベル。視覚的に記憶に残す手がかり。
const POS_MAP = [
  { test:/名詞|noun/i,                         key:'noun', label:'名詞',  emoji:'📦', color:'#2b4c7e' },
  { test:/動詞|verb/i,                          key:'verb', label:'動詞',  emoji:'🏃', color:'#b4452a' },
  { test:/形容詞|adjective/i,                    key:'adj',  label:'形容詞', emoji:'🎨', color:'#2e7d51' },
  { test:/副詞|adverb/i,                         key:'adv',  label:'副詞',  emoji:'⚡', color:'#7a4fb0' },
  { test:/代名詞|pronoun/i,                      key:'pron', label:'代名詞', emoji:'👤', color:'#0d8a9e' },
  { test:/数詞|numeral|数/i,                     key:'num',  label:'数詞',  emoji:'🔢', color:'#c77d0a' },
  { test:/接続詞|conjunction/i,                  key:'conj', label:'接続詞', emoji:'🔗', color:'#7a7060' },
  { test:/(後置詞|前置詞|adposition|postposition)/i, key:'adp', label:'後置詞', emoji:'📍', color:'#9c6b2e' },
  { test:/感動詞|interjection/i,                 key:'intj', label:'感動詞', emoji:'❗', color:'#c0568a' },
];
function posStyle(wordClass) {
  const w = wordClass || '';
  for (const p of POS_MAP) if (p.test.test(w)) return p;
  return { key:'other', label:(w || 'その他'), emoji:'🔤', color:'#6a665c' };
}
// 簡易要素ヘルパー（textContentのみ使用＝XSS安全）
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

/* ---------- 詳細カード ---------- */
function showDetail(key) {
  const m = marked[key]; const d = $("detail");
  d.textContent = "";
  if (!m) return;
  if (m.status === "loading") {
    const box = el('div','detail');
    box.appendChild(el('span','spin'));
    box.appendChild(document.createTextNode(' 「' + m.surface + '」を分析中…'));
    d.appendChild(box); return;
  }
  if (m.status === "error") {
    d.appendChild(el('div','detail err','分析に失敗しました。もう一度クリックしてください。'));
    return;
  }
  const x = m.data; const ps = posStyle(x.wordClass);
  const box = el('div','detail');
  box.style.setProperty('--pos', ps.color);

  const head = el('div','dhead');
  head.appendChild(el('span','orig', m.surface));
  head.appendChild(el('span','arrow','→'));
  head.appendChild(el('span','base', x.perusmuoto || ''));
  if (x.wordClass) {
    const badge = el('span','pos-badge', ps.emoji + ' ' + x.wordClass);
    badge.style.background = ps.color;
    head.appendChild(badge);
  }
  box.appendChild(head);

  box.appendChild(detailRow('この文での意味', x.contextMeaning, true));
  box.appendChild(detailRow('原形の意味', x.baseMeaning));
  box.appendChild(detailRow('なぜこの形？', x.plain));
  if (x.grammar) {
    const det = document.createElement('details');
    det.appendChild(el('summary', null, '▾ 文法用語でくわしく'));
    det.appendChild(el('div','gtext', x.grammar));

  }
  d.appendChild(box);
}
function detailRow(label, val, strong) {
  const r = el('div','row');
  r.appendChild(el('div','rlabel', label));

}

/* ---------- 単語帳（localStorage） ---------- */
function loadVocab(){ try { return JSON.parse(localStorage.getItem("lukija_vocab")||"[]"); } catch(e){ return []; } }
function saveVocab(){ localStorage.setItem("lukija_vocab", JSON.stringify(vocab)); renderVocab(); }
function addToVocab(data, surface){
  if (vocab.some(v => v.perusmuoto === data.perusmuoto)) { renderVocab(); return; }
  vocab.unshift({ ...data, surface, ts: Date.now() });
  saveVocab();
}
function renderVocab(){
  $("vcard").style.display = vocab.length ? "block" : "none";
  renderStats();
  const list = $("vlist"); list.textContent = "";
  vocab.forEach((v, i) => {
    const ps = posStyle(v.wordClass);
    const item = el('div','vitem'); item.dataset.i = i;
    item.style.borderLeftColor = ps.color;

    const word = el('span','vword');
    word.appendChild(el('span','vemoji', ps.emoji));
    word.appendChild(el('span', null, v.perusmuoto));
    item.appendChild(word);

    const right = el('span');
    right.appendChild(el('span','vmean', v.contextMeaning || ''));
    const del = el('span','vdel','✕'); del.dataset.del = i;
    right.appendChild(del);
    item.appendChild(right);

    item.onclick = (ev) => {
      if (ev.target.dataset.del !== undefined) { vocab.splice(+ev.target.dataset.del,1); saveVocab(); return; }
      const vv = vocab[+item.dataset.i];
      const key = vv.surface.toLowerCase();
      marked[key] = { status:"done", data:vv, surface:vv.surface, sentence:"" };
      highlightSelected(key); showDetail(key);
      $("detail").scrollIntoView({behavior:"smooth", block:"center"});
    };
    list.appendChild(item);
  });
}
// 学習の可視化: 総語数・品詞バランス・直近7日の学習量
function renderStats(){
  const box = $("vstats");
  if (!box) return;
  box.textContent = "";
  if (!vocab.length) return;

  // (a) 総語数
  const total = el('div','stat-total');
  total.appendChild(el('span','stat-num', String(vocab.length)));
  total.appendChild(el('span','stat-lab', '語 覚えた'));
  box.appendChild(total);

  const grid = el('div','stat-grid');

  // (b) 品詞のバランス
  const posSec = el('div','stat-section');
  posSec.appendChild(el('div','stat-title','品詞のバランス'));
  const counts = {};
  vocab.forEach(v => {
    const ps = posStyle(v.wordClass);
    if (!counts[ps.key]) counts[ps.key] = { ps, n:0 };
    counts[ps.key].n++;
  });
  const rows = Object.values(counts).sort((a,b) => b.n - a.n);
  const maxN = rows.reduce((m,r) => Math.max(m, r.n), 1);
  rows.forEach(r => {
    const row = el('div','bar-row');
    row.appendChild(el('div','bar-name', r.ps.emoji + ' ' + r.ps.label));
    const track = el('div','bar-track');
    const fill = el('div','bar-fill');
    fill.style.background = r.ps.color;
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('div','bar-cnt', String(r.n)));
    posSec.appendChild(row);
    // アニメーション: 次フレームで幅を設定
    requestAnimationFrame(() => { fill.style.width = Math.round(r.n / maxN * 100) + '%'; });
  });
  grid.appendChild(posSec);

  // (c) この7日間
  const daySec = el('div','stat-section');
  daySec.appendChild(el('div','stat-title','この7日間'));
  const WD = ['日','月','火','水','木','金','土'];
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for (let i = 6; i >= 0; i--){
    const d = new Date(today); d.setDate(today.getDate() - i);
    days.push({ start: d.getTime(), end: d.getTime() + 86400000, wd: d.getDay(), n:0, isToday: i === 0 });
  }
  vocab.forEach(v => {
    const t = v.ts || 0;
    for (const day of days){ if (t >= day.start && t < day.end){ day.n++; break; } }
  });
  const maxD = days.reduce((m,d) => Math.max(m, d.n), 1);
  const cols = el('div','day-cols');
  days.forEach(d => {
    const col = el('div','day-col');
    const bar = el('div','day-bar' + (d.n ? ' on' : ''));
    bar.title = d.n + '語';
    col.appendChild(bar);
    col.appendChild(el('div','day-cap' + (d.isToday ? ' today' : ''), WD[d.wd]));
    cols.appendChild(col);
    requestAnimationFrame(() => { bar.style.height = Math.round(d.n / maxD * 100) + '%'; });
  });
  daySec.appendChild(cols);
  grid.appendChild(daySec);

  box.appendChild(grid);
}
function exportAnki(){
  const tsv = vocab.map(v => `${v.perusmuoto}\t${v.contextMeaning||""}\t${v.plain||""}`).join("\n");

  const a = document.createElement("a"); a.href = url; a.download = "lukija_vocab.tsv"; a.click();
  URL.revokeObjectURL(url);
}

async function renderRss(src, body) {
  const spin = document.createElement('div');
  spin.className = 'picker-spin';
  const ic = document.createElement('span'); ic.className = 'spin';
  const tx = document.createElement('span'); tx.textContent = '最新記事を取得中…';
  spin.appendChild(ic); spin.appendChild(tx);
  body.appendChild(spin);
  try {
    let items = rssCache[src.id];
    if (!items) {
      const xml = await fetch(PROXY + "?url=" + encodeURIComponent(src.url)).then(r => r.text());
      if (!xml || xml.startsWith("ERROR:")) throw new Error("rss fetch failed");
      const doc = new DOMParser().parseFromString(xml, "application/xml");
      if (doc.querySelector("parsererror")) throw new Error("rss parse failed");
      items = Array.from(doc.querySelectorAll("item")).slice(0, 8).map(it => ({
        title: (it.querySelector("title")?.textContent || "").trim(),
        link:  (it.querySelector("link")?.textContent || "").trim().replace(/\?origin=rss$/, ""),
        desc:  stripHtml(it.querySelector("description")?.textContent || ""),
        img:   bumpImg(firstImage(it)),
      })).filter(it => it.link);
      if (items.length === 0) throw new Error("no items");
      rssCache[src.id] = items;
    }
    // 選択が切り替わっていたら描画しない
    if (activeSrc !== src.id) return;
    body.textContent = '';
    items.forEach(it => {
      const card = document.createElement('button');
      card.className = 'src-item rss-card'; card.type = 'button';

      // サムネイル（あれば画像、なければ頭文字プレースホルダ）

      const cleanTitle = it.title.replace(/^Selkouutiset\s*\|\s*/i, "").trim() || it.title;
      if (it.img) {
        const im = document.createElement('img');
        im.src = it.img; im.alt = ''; im.loading = 'lazy';
        im.onerror = () => { thumb.classList.add('ph'); im.remove();
          thumb.appendChild(document.createTextNode((cleanTitle[0] || '∗').toUpperCase())); };
        thumb.appendChild(im);
      } else {
        thumb.classList.add('ph');
        thumb.textContent = (cleanTitle[0] || '∗').toUpperCase();
      }
      card.appendChild(thumb);

      const left = document.createElement('div'); left.className = 'rss-text';
      const t = document.createElement('div'); t.className = 'src-title';
      t.textContent = cleanTitle;
      left.appendChild(t);
      if (it.desc) {
        const s = document.createElement('div'); s.className = 'src-sub';

      card.appendChild(left);
      const a = document.createElement('span'); a.className = 'src-action'; a.textContent = '読む →';
      card.appendChild(a);
      card.onclick = () => { $('url').value = it.link; importFromUrl(it.link); };
      body.appendChild(card);
    });
  } catch (e) {
    // 取得失敗 → このソースのチップを隠し、他の生きているソースへフォールバック

    }
  }

function renderLinks(src, body) {
  body.textContent = '';
  const groups = new Map();
  (src.items || []).forEach(it => {
    const g = it.group || '';

    groups.get(g).push(it);
  });
  groups.forEach((items, g) => {
    if (g) {
      const h = document.createElement('div');
      h.className = 'src-group-head'; h.textContent = g;
      body.appendChild(h);
    }
    items.forEach(it => {
      let el;
      if (it.read) {
        el = document.createElement('button'); el.type = 'button'; el.className = 'src-item';
        el.onclick = () => { $('url').value = it.url; importFromUrl(it.url); };
      } else {
        el = document.createElement('a'); el.className = 'src-item ext';
        el.href = it.url; el.target = '_blank'; el.rel = 'noopener';
      }
      const left = document.createElement('div');

      left.appendChild(t);
      if (it.note) {
        const s = document.createElement('div'); s.className = 'src-sub'; s.textContent = it.note;

      a.textContent = it.read ? '読む →' : '↗ サイトを開く';
      el.appendChild(a);
      body.appendChild(el);
    });
  });
}

// RSS item から最初の画像URLを拾う（enclosure / media:* / content:encoded・description 内の <img>）
function firstImage(item) {
  // enclosure type=image
  const enc = Array.from(item.querySelectorAll("enclosure")).find(e =>
    (e.getAttribute("type") || "").startsWith("image") || /\.(jpe?g|png|webp)/i.test(e.getAttribute("url") || ""));
  if (enc && enc.getAttribute("url")) return enc.getAttribute("url");
  // media:content / media:thumbnail（名前空間つきは getElementsByTagName で拾う）
  const media = item.getElementsByTagName("media:content")[0] || item.getElementsByTagName("media:thumbnail")[0];
  if (media && media.getAttribute("url")) return media.getAttribute("url");
  // content:encoded / description 内の <img src>
  const html = (item.getElementsByTagName("content:encoded")[0]?.textContent)
    || (item.querySelector("description")?.textContent) || "";
  const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
  if (m) return m[1];
  return "";
}

// Yle Cloudinary のサムネは w_NNN,h_NNN を含む → 大きめに差し替えて綺麗に表示
function bumpImg(url) {
  if (!url) return "";
  return url.replace(/w_\d+,h_\d+/, "w_480,h_270");
}

// RSS description 等の HTML 断片をプレーンテキスト化（DOMには挿入しない）
function stripHtml(s) {
  if (!s) return '';
  if (/<[^>]+>/.test(s)) {
    const d = new DOMParser().parseFromString(s, "text/html");
    return (d.body.textContent || "").replace(/\s+/g, " ").trim();
  }
  return s.replace(/\s+/g, " ").trim();
}

};

$('helperSend').onclick = async () => {
  if (!helperImageB64) return;
  const question = $('helperQ').value.trim();
  const btn = $('helperSend'); btn.disabled = true;
  $('helperSpin').style.display = 'inline';
  $('helperMsg').textContent = '解説を生成中…';
  $('helperResult').textContent = '';
  try {
    const res = await fetch(PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ mode: 'image', mediaType: 'image/jpeg', image: helperImageB64, question }),
    });
    const text = await res.text();
    $('helperSpin').style.display = 'none';
    $('helperMsg').textContent = '';
    if (text === 'RATE_LIMIT') {
      renderHelperError($('helperResult'), 'レート制限に達しました（無料枠の上限）。', '1分ほど待ってから「解説して」をもう一度押してください。');
    } else {
      renderHelperText($('helperResult'), text);
    }
  } catch (err) {
    $('helperSpin').style.display = 'none';
    $('helperMsg').textContent = '';
    renderHelperError($('helperResult'), '通信エラー: ' + err.message);
  }
  btn.disabled = false;
};

function resizeToJpeg(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1600;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (Math.max(w, h) > MAX) {
          if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('画像デコード失敗'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error('ファイル読み込み失敗'));
    reader.readAsDataURL(file);
  });
}

/* Gemini の応答テキストを DOM で安全にレンダリング（textContent のみ使用）*/
function renderHelperText(container, text) {
  container.textContent = '';
  const outer = document.createElement('div');
  outer.className = 'hresult';
  text.split(/\n{2,}/).forEach(block => {
    const trimmed = block.trim(); if (!trimmed) return;
    let el;
    if (/^#{1,3} /.test(trimmed)) {
      el = document.createElement('h3');
      el.textContent = trimmed.replace(/^#{1,3} /, '');
    } else {
      el = document.createElement('p');
      trimmed.split(/(\*\*[^*]+\*\*)/).forEach((seg, i) => {
        if (i % 2 === 1) {
          const b = document.createElement('strong');
          b.textContent = seg.slice(2, -2);
          el.appendChild(b);
        } else {
          seg.split('\n').forEach((ln, j, arr) => {
            el.appendChild(document.createTextNode(ln));
            if (j < arr.length - 1) el.appendChild(document.createElement('br'));
          });
        }
      });
    }
    outer.appendChild(el);
  });
  container.appendChild(outer);
}

function renderHelperError(container, msg, hint) {
  container.textContent = '';
  const outer = document.createElement('div');
  outer.className = 'hresult';
  const p = document.createElement('p'); p.className = 'err'; p.textContent = msg;
  outer.appendChild(p);
  if (hint) {
    const p2 = document.createElement('p'); p2.className = 'retry-hint'; p2.textContent = hint;
    outer.appendChild(p2);
  }
  container.appendChild(outer);
}
