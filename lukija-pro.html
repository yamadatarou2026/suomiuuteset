<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lukija — フィンランド語 精読</title>

<!-- 本文抽出ライブラリ (Mozilla Readability) -->
<script src="https://cdn.jsdelivr.net/npm/@mozilla/readability@0.5.0/Readability.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ───────── ① ここだけ設定 ───────── */
  /* GASをデプロイして得た /exec のURLを下の値に貼り替えてください */
  /* （JS側の PROXY を読みます） */

  :root{
    --paper:#f4efe6; --ink:#20201d; --ink-soft:#6a665c;
    --accent:#2b4c7e; --accent-d:#1d3559;
    --mark:rgba(242,193,78,.55); --mark-soft:rgba(242,193,78,.30);
    --line:#ddd5c6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink); font-family:'Archivo',sans-serif;
    background-image:
      radial-gradient(circle at 18% 10%, rgba(43,76,126,.05), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(242,193,78,.06), transparent 42%);
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:26px 18px 90px}
  .chip{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--accent)}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:2.4rem;margin:2px 0 2px;letter-spacing:-.02em}
  .sub{color:var(--ink-soft);margin:0 0 18px;font-size:.95rem}

  .bar{display:flex;gap:8px;flex-wrap:wrap;background:#fbf8f1;border:1px solid var(--line);border-radius:14px;padding:12px}
  .bar input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:'Archivo',sans-serif;font-size:.95rem;background:#fff;color:var(--ink);outline:none}
  .bar input:focus{border-color:var(--accent)}
  .btn{font-family:'Archivo',sans-serif;font-weight:600;border:none;cursor:pointer;border-radius:10px;transition:transform .1s,background .2s,opacity .2s;padding:11px 18px;font-size:.92rem}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-d)}
  .btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  .btn-ghost:hover{background:rgba(43,76,126,.07)}
  .btn:disabled{opacity:.5;cursor:default}

  .paste-wrap{margin-top:10px}
  .paste-wrap textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font-family:'Fraunces',serif;font-size:1.02rem;line-height:1.7;background:#fff;color:var(--ink);outline:none;resize:vertical}
  .paste-wrap textarea:focus{border-color:var(--accent)}
  .toggle{display:inline-block;margin-top:10px;font-size:.82rem;font-weight:600;color:var(--accent);cursor:pointer}

  .status{margin:16px 2px;color:var(--ink-soft);font-size:.9rem;display:flex;align-items:center;gap:10px}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
  @keyframes rot{to{transform:rotate(360deg)}}
  .err{color:#b4452a}

  .card{background:#fbf8f1;border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-top:18px}
  .article{font-family:'Fraunces',serif;font-size:1.2rem;line-height:2.0;color:var(--ink)}
  .article p{margin:0 0 1.05em}
  .article h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.55rem;margin:.2em 0 .5em}
  .article h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.3rem;margin:1.3em 0 .35em;color:var(--accent-d)}
  .article h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.12rem;margin:1.1em 0 .3em}
  .article a{color:inherit;text-decoration:none}
  .article li{margin:.25em 0}
  .w{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .15s}
  .w:hover{background:rgba(43,76,126,.12)}
  .w.loading{background:var(--mark-soft);animation:pulse 1.1s ease-in-out infinite}
  .w.marked{background:var(--mark);box-shadow:inset 0 -2px 0 rgba(170,115,12,.65)}
  .w.selected{outline:2px solid var(--accent);outline-offset:1px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  .detail{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-top:18px;box-shadow:0 6px 24px rgba(40,40,30,.07);animation:slide .3s ease both}
  @keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .orig{font-family:'Fraunces',serif;font-size:1.5rem;color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--mark)}
  .arrow{color:var(--accent);font-size:1.1rem}
  .base{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:600}
  .row{padding:8px 0;border-top:1px solid var(--line)}
  .rlabel{font-size:.74rem;font-weight:700;color:var(--accent);letter-spacing:.03em;margin-bottom:3px}
  .rval{font-size:.96rem;line-height:1.55}
  .rval.strong{font-size:1.05rem;font-weight:600}
  details{margin-top:8px}
  summary{cursor:pointer;font-size:.78rem;font-weight:700;color:var(--accent);letter-spacing:.03em;list-style:none}
  summary::-webkit-details-marker{display:none}
  .gtext{font-size:.92rem;line-height:1.55;color:var(--ink-soft);padding-top:8px}

  .vcard{background:#fbf8f1;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-top:18px}
  .vhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .vitem{display:flex;justify-content:space-between;gap:12px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
  .vitem:hover{background:rgba(43,76,126,.06)}
  .vword{font-family:'Fraunces',serif;font-weight:600}
  .vmean{color:var(--ink-soft);font-size:.92rem;text-align:right}
  .vdel{color:#c0796a;font-size:.8rem;margin-left:8px;cursor:pointer}
  .foot{color:var(--ink-soft);font-size:.78rem;text-align:center;margin-top:28px}

  /* ── タブ ──────────────────────────────────────────────────── */
  .tabs{display:flex;gap:4px;margin:0 0 18px}
  .tab{font-family:'Archivo',sans-serif;font-size:.85rem;font-weight:700;letter-spacing:.04em;
    border:1px solid var(--line);border-radius:10px;padding:8px 18px;cursor:pointer;
    background:transparent;color:var(--ink-soft);transition:background .15s,color .15s}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tab:not(.active):hover{background:rgba(43,76,126,.08)}

  /* ── 画像ヘルパー ─────────────────────────────────────────── */
  .img-drop{border:2px dashed var(--line);border-radius:14px;padding:24px 18px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
  .img-drop:hover,.img-drop.over{border-color:var(--accent);background:rgba(43,76,126,.05)}
  .img-drop input[type=file]{display:none}
  .img-drop label{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
  .img-icon{font-size:2.4rem;line-height:1}
  .img-hint{font-size:.82rem;color:var(--ink-soft)}
  #imgPreview{max-width:100%;max-height:300px;border-radius:10px;border:1px solid var(--line);display:none;margin-top:14px}
  .hq-wrap{margin-top:12px}
  .hq-wrap textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:'Archivo',sans-serif;font-size:.92rem;background:#fff;color:var(--ink);outline:none;resize:vertical}
  .hq-wrap textarea:focus{border-color:var(--accent)}
  .hresult{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-top:18px;font-size:.95rem;line-height:1.78;animation:slide .3s ease both}
  .hresult p{margin:.4em 0}
  .hresult h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;margin:.9em 0 .3em;color:var(--accent-d)}
  .hresult strong{font-weight:700}
  .retry-hint{color:var(--ink-soft);font-size:.87rem}

  /* ── 最新記事リスト ──────────────────────────────────────── */
  .recent{margin-top:14px}
  .recent-head{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;
    color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .recent-list{display:flex;flex-direction:column;gap:6px}
  .recent-item{display:block;width:100%;text-align:left;background:#fbf8f1;
    border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;
    font-family:'Archivo',sans-serif;color:var(--ink);
    transition:background .15s,border-color .15s,transform .1s}
  .recent-item:hover{background:rgba(43,76,126,.06);border-color:var(--accent)}
  .recent-item:active{transform:translateY(1px)}
  .recent-date{font-weight:600;font-size:.9rem;color:var(--accent-d)}
  .recent-desc{font-size:.82rem;color:var(--ink-soft);margin-top:2px;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
  <div class="chip">SUOMEN KIELI · 精読</div>
  <h1>lukija</h1>
  <p class="sub">フィンランド語のニュースURLを貼って、わからない単語をクリック。原形・格・訳がその場で出ます。</p>

  <div class="tabs">
    <button class="tab active" data-tab="reading">リーディング</button>
    <button class="tab" data-tab="helper">画像ヘルパー</button>
  </div>

  <div id="readingPanel">
  <div class="bar">
    <input id="url" type="url" placeholder="https://yle.fi/a/… の記事URLを貼る" />
    <button id="go" class="btn btn-primary">取り込む</button>
  </div>

  <div id="recent" class="recent" style="display:none">
    <div class="recent-head">
      <span>最新の Selkouutiset</span>
      <span id="recentSpin" style="display:none"><span class="spin"></span></span>
    </div>
    <div id="recentList" class="recent-list"></div>
  </div>

  <span id="pasteToggle" class="toggle">▾ 直接テキストを貼る（URLで取れないサイト用）</span>
  <div id="pasteWrap" class="paste-wrap" style="display:none">
    <textarea id="paste" rows="6" placeholder="記事本文をここに貼り付け…"></textarea>
    <button id="goPaste" class="btn btn-ghost" style="margin-top:10px">このテキストで読む</button>
  </div>

  <div id="status" class="status" style="display:none"></div>

  <div id="articleCard" class="card" style="display:none">
    <div id="article" class="article"></div>
  </div>

  <div id="detail"></div>

  <div id="vcard" class="vcard" style="display:none">
    <div class="vhead">
      <span class="chip">単語帳</span>
      <div>
        <button id="anki" class="btn btn-ghost" style="padding:6px 12px;font-size:.78rem">Anki用に書き出し</button>
        <button id="clearVocab" class="btn btn-ghost" style="padding:6px 12px;font-size:.78rem">空にする</button>
      </div>
    </div>
    <div id="vlist"></div>
  </div>

  </div><!-- /#readingPanel -->

  <div id="helperPanel" style="display:none">
    <div class="card">
      <div class="img-drop" id="imgDrop">
        <input type="file" id="imgFile" accept="image/*" capture="environment">
        <label for="imgFile">
          <span class="img-icon">📷</span>
          <span>タップして写真を選ぶ（スマホカメラも可）</span>
          <span class="img-hint">PNG・JPEG・HEIC など。自動でJPEGに縮小します。</span>
        </label>
        <img id="imgPreview" alt="プレビュー">
      </div>
      <div class="hq-wrap">
        <textarea id="helperQ" rows="3" placeholder="質問（任意）: ここがわからない、この文のどこが間違いか、など…"></textarea>
      </div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <button id="helperSend" class="btn btn-primary" disabled>解説して</button>
        <span id="helperSpin" style="display:none"><span class="spin"></span></span>
        <span id="helperMsg" style="color:var(--ink-soft);font-size:.88rem"></span>
      </div>
    </div>
    <div id="helperResult"></div>
  </div><!-- /#helperPanel -->

  <div class="foot">lukija · 単語帳はこの端末に保存されます（localStorage）</div>
</div>

<script>
/* ═══════════ ① 設定：GASの /exec URL を貼り替える ═══════════ */
const PROXY = "https://script.google.com/macros/s/AKfycbzL6k4NCy0Jkq-zbRmWdCq0mOHiuDoTJ8l8b40ngSlAgpgFzZ2oplgiDL80Cb3BcADN2w/exec";
/* ════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
let marked = {};        // 現在の記事内: surface(lower) -> {status,data,surface,sentence}
let selectedKey = null;
let vocab = loadVocab(); // 永続単語帳: [{perusmuoto,contextMeaning,...}]

/* ---------- 取り込み（URL → プロキシ → Readability） ---------- */
async function importFromUrl(url) {
  setStatus("ページを取得中…", true);
  try {
    const html = await fetch(PROXY + "?url=" + encodeURIComponent(url)).then(r => r.text());
    if (html.startsWith("ERROR:")) throw new Error(html);
    const doc = new DOMParser().parseFromString(html, "text/html");
    const parsed = new Readability(doc).parse();
    if (!parsed || !parsed.textContent || parsed.textContent.trim().length < 40) {
      throw new Error("本文をうまく抽出できませんでした");
    }
    setStatus("", false);
    renderArticle(parsed.content, true);
  } catch (e) {
    setStatus("取り込み失敗：" + e.message + " — 下の「直接テキストを貼る」をお試しください。", false, true);
  }
}

/* ---------- 記事描画（構造を残して単語をクリック可能に） ---------- */
function renderArticle(input, isHTML) {
  marked = {}; selectedKey = null; $("detail").innerHTML = "";
  const a = $("article"); a.innerHTML = "";
  const root = document.createElement("div");

  if (isHTML) {
    root.innerHTML = input; // Readabilityの整形済みHTML
    // 不要な要素を除去（画像・キャプション・埋め込みなど）
    root.querySelectorAll("img,figure,figcaption,picture,svg,video,iframe,button,nav,aside,form").forEach(n => n.remove());
  } else {
    // 貼り付けテキスト：空行で段落に分ける
    input.split(/\n\s*\n|\n/).filter(s => s.trim()).forEach(par => {
      const p = document.createElement("p"); p.textContent = par.trim(); root.appendChild(p);
    });
  }

  wrapWords(root);
  while (root.firstChild) a.appendChild(root.firstChild);
  $("articleCard").style.display = "block";
}

// テキストノードを走査し、単語を <span class="w"> で包む（見出し・段落構造は保持）
function wrapWords(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = []; let n;
  while ((n = walker.nextNode())) nodes.push(n);
  nodes.forEach((node) => {
    const block = (node.parentElement && node.parentElement.closest("p,h1,h2,h3,h4,li,blockquote")) || node.parentElement;
    const context = (block ? block.textContent : node.nodeValue).trim();
    const parts = tokenize(node.nodeValue);
    if (!parts.some(p => p.w)) return; // 単語が無ければそのまま
    const frag = document.createDocumentFragment();
    parts.forEach((p) => {
      if (!p.w) { frag.appendChild(document.createTextNode(p.t)); return; }
      const span = document.createElement("span");
      span.className = "w"; span.textContent = p.t;
      span.onclick = () => handleWord(p.t, context, span);
      frag.appendChild(span);
    });
    node.parentNode.replaceChild(frag, node);
  });
}

function tokenize(text) {
  const parts = []; const re = /[\p{L}][\p{L}\p{M}'’-]*/gu; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push({ t: text.slice(last, m.index), w: false });
    parts.push({ t: m[0], w: true }); last = m.index + m[0].length;
  }
  if (last < text.length) parts.push({ t: text.slice(last), w: false });
  return parts;
}

/* ---------- 単語クリック → 分析（プロキシ経由） ---------- */
async function handleWord(surface, sentence, span) {
  const key = surface.toLowerCase();
  highlightSelected(key);
  if (marked[key] && marked[key].status === "done") { showDetail(key); return; }

  marked[key] = { status: "loading", surface, sentence };
  paintWord();
  showDetail(key);
  try {
    const res = await fetch(PROXY, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // ← preflight回避
      body: JSON.stringify({ word: surface, sentence: sentence.trim() }),
    });
    const data = JSON.parse(await res.text());
    marked[key] = { status: "done", data, surface, sentence };
    addToVocab(data, surface);
  } catch (e) {
    marked[key] = { status: "error", surface, sentence };
  }
  paintWord(); showDetail(key);
}

function highlightSelected(key){ selectedKey = key; paintWord(); }
function paintWord() {
  document.querySelectorAll(".w").forEach((el) => {
    const k = el.textContent.toLowerCase();
    const m = marked[k];
    el.className = "w"
      + (m && m.status === "loading" ? " loading" : "")
      + (m && (m.status === "done" || m.status === "error") ? " marked" : "")
      + (selectedKey === k ? " selected" : "");
  });
}

/* ---------- 詳細カード ---------- */
function showDetail(key) {
  const m = marked[key]; const d = $("detail");
  if (!m) { d.innerHTML = ""; return; }
  if (m.status === "loading") {
    d.innerHTML = `<div class="detail"><span class="spin"></span> 「${esc(m.surface)}」を分析中…</div>`; return;
  }
  if (m.status === "error") {
    d.innerHTML = `<div class="detail err">分析に失敗しました。もう一度クリックしてください。</div>`; return;
  }
  const x = m.data;
  d.innerHTML = `<div class="detail">
    <div class="dhead">
      <span class="orig">${esc(m.surface)}</span><span class="arrow">→</span>
      <span class="base">${esc(x.perusmuoto)}</span>
      <span class="chip" style="align-self:center">${esc(x.wordClass||"")}</span>
    </div>
    <div class="row"><div class="rlabel">この文での意味</div><div class="rval strong">${esc(x.contextMeaning||"")}</div></div>
    <div class="row"><div class="rlabel">原形の意味</div><div class="rval">${esc(x.baseMeaning||"")}</div></div>
    <div class="row"><div class="rlabel">なぜこの形？</div><div class="rval">${esc(x.plain||"")}</div></div>
    ${x.grammar ? `<details><summary>▾ 文法用語でくわしく</summary><div class="gtext">${esc(x.grammar)}</div></details>` : ""}
  </div>`;
}

/* ---------- 単語帳（localStorage） ---------- */
function loadVocab(){ try { return JSON.parse(localStorage.getItem("lukija_vocab")||"[]"); } catch(e){ return []; } }
function saveVocab(){ localStorage.setItem("lukija_vocab", JSON.stringify(vocab)); renderVocab(); }
function addToVocab(data, surface){
  if (vocab.some(v => v.perusmuoto === data.perusmuoto)) { renderVocab(); return; }
  vocab.unshift({ ...data, surface, ts: Date.now() });
  saveVocab();
}
function renderVocab(){
  $("vcard").style.display = vocab.length ? "block" : "none";
  $("vlist").innerHTML = vocab.map((v,i) => `
    <div class="vitem" data-i="${i}">
      <span class="vword">${esc(v.perusmuoto)}</span>
      <span><span class="vmean">${esc(v.contextMeaning||"")}</span><span class="vdel" data-del="${i}">✕</span></span>
    </div>`).join("");
  $("vlist").querySelectorAll(".vitem").forEach(el => {
    el.onclick = (ev) => {
      if (ev.target.dataset.del !== undefined) { vocab.splice(+ev.target.dataset.del,1); saveVocab(); return; }
      const v = vocab[+el.dataset.i];
      const key = v.surface.toLowerCase();
      marked[key] = { status:"done", data:v, surface:v.surface, sentence:"" };
      highlightSelected(key); showDetail(key);
      $("detail").scrollIntoView({behavior:"smooth", block:"center"});
    };
  });
}
function exportAnki(){
  const tsv = vocab.map(v => `${v.perusmuoto}\t${v.contextMeaning||""}\t${v.plain||""}`).join("\n");
  const blob = new Blob([tsv], {type:"text/tab-separated-values"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "lukija_vocab.tsv"; a.click();
  URL.revokeObjectURL(url);
}

/* ---------- ヘルパー ---------- */
function setStatus(msg, spin, isErr){
  const s = $("status");
  if (!msg){ s.style.display="none"; return; }
  s.style.display="flex"; s.className = "status" + (isErr?" err":"");
  s.innerHTML = (spin?`<span class="spin"></span>`:"") + esc(msg);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- 配線 ---------- */
$("go").onclick = () => { const u = $("url").value.trim(); if (u) importFromUrl(u); };
$("url").addEventListener("keydown", e => { if (e.key==="Enter") $("go").click(); });
$("goPaste").onclick = () => { const t = $("paste").value.trim(); if (t) { setStatus("",false); renderArticle(t, false); } };
$("pasteToggle").onclick = () => {

/* ── 起動時: Selkouutiset の RSS から最新記事ボタンを生成 ───── */
// 確認済みフィード (2026-05 時点): item に title(日付), link(/a/...?origin=rss), description(トピック要約)
const RSS_URL = "https://feeds.yle.fi/uutiset/v1/recent.rss?publisherIds=YLE_SELKOUUTISET";

async function loadRecent() {
  const section = $('recent');
  const spin = $('recentSpin');
  section.style.display = 'block';
  spin.style.display = 'inline';
  try {
    const xml = await fetch(PROXY + "?url=" + encodeURIComponent(RSS_URL)).then(r => r.text());
    if (!xml || xml.startsWith("ERROR:")) throw new Error("rss fetch failed");
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    if (doc.querySelector("parsererror")) throw new Error("rss parse failed");
    const items = Array.from(doc.querySelectorAll("item")).slice(0, 6);
    if (items.length === 0) throw new Error("no items");

    const list = $('recentList');
    list.textContent = '';
    items.forEach(it => {
      const title = (it.querySelector("title")?.textContent || "").trim();
      const linkRaw = (it.querySelector("link")?.textContent || "").trim();
      const desc = (it.querySelector("description")?.textContent || "").trim();
      if (!linkRaw) return;
      const link = linkRaw.replace(/\?origin=rss$/, "");
      // 「Selkouutiset | keskiviikko 27.5.2026」→「keskiviikko 27.5.2026」
      const dateLabel = title.replace(/^Selkouutiset\s*\|\s*/i, "").trim() || title;

      const btn = document.createElement('button');
      btn.className = 'recent-item';
      btn.type = 'button';
      const d1 = document.createElement('div');
      d1.className = 'recent-date';
      d1.textContent = dateLabel;
      btn.appendChild(d1);
      if (desc) {
        const d2 = document.createElement('div');
        d2.className = 'recent-desc';
        d2.textContent = desc;
        btn.appendChild(d2);
      }
      btn.onclick = () => { $('url').value = link; importFromUrl(link); };
      list.appendChild(btn);
    });
    spin.style.display = 'none';
  } catch (e) {
    // 取得失敗時はセクションごと非表示にして既存挙動を壊さない
    section.style.display = 'none';
  }
}

loadRecent();

/* ── 画像ヘルパー ─────────────────────────────────────────── */
let helperImageB64 = null;

$('imgFile').onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const dataUrl = await resizeToJpeg(file);
    helperImageB64 = dataUrl.split(',')[1];
    const prev = $('imgPreview');
    prev.src = dataUrl; prev.style.display = 'block';
    $('helperSend').disabled = false;
  } catch (err) {
    helperImageB64 = null;
    $('helperSend').disabled = true;
    renderHelperError($('helperResult'), '画像の読み込みに失敗しました: ' + err.message);
  }
};

$('helperSend').onclick = async () => {
  if (!helperImageB64) return;
  const question = $('helperQ').value.trim();
  const btn = $('helperSend'); btn.disabled = true;
  $('helperSpin').style.display = 'inline';
  $('helperMsg').textContent = '解説を生成中…';
  $('helperResult').textContent = '';
  try {
    const res = await fetch(PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ mode: 'image', mediaType: 'image/jpeg', image: helperImageB64, question }),
    });
    const text = await res.text();
    $('helperSpin').style.display = 'none';
    $('helperMsg').textContent = '';
    if (text === 'RATE_LIMIT') {
      renderHelperError($('helperResult'), 'レート制限に達しました（無料枠の上限）。', '1分ほど待ってから「解説して」をもう一度押してください。');
    } else {
      renderHelperText($('helperResult'), text);
    }
  } catch (err) {
    $('helperSpin').style.display = 'none';
    $('helperMsg').textContent = '';
    renderHelperError($('helperResult'), '通信エラー: ' + err.message);
  }
  btn.disabled = false;
};

function resizeToJpeg(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1600;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (Math.max(w, h) > MAX) {
          if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('画像デコード失敗'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error('ファイル読み込み失敗'));
    reader.readAsDataURL(file);
  });
}

/* Gemini の応答テキストを DOM で安全にレンダリング（textContent のみ使用）*/
function renderHelperText(container, text) {
  container.textContent = '';
  const outer = document.createElement('div');
  outer.className = 'hresult';
  text.split(/\n{2,}/).forEach(block => {
    const trimmed = block.trim(); if (!trimmed) return;
    let el;
    if (/^#{1,3} /.test(trimmed)) {
      el = document.createElement('h3');
      el.textContent = trimmed.replace(/^#{1,3} /, '');
    } else {
      el = document.createElement('p');
      trimmed.split(/(\*\*[^*]+\*\*)/).forEach((seg, i) => {
        if (i % 2 === 1) {
          const b = document.createElement('strong');
          b.textContent = seg.slice(2, -2);
          el.appendChild(b);
        } else {
          seg.split('\n').forEach((ln, j, arr) => {
            el.appendChild(document.createTextNode(ln));
            if (j < arr.length - 1) el.appendChild(document.createElement('br'));
          });
        }
      });
    }
    outer.appendChild(el);
  });
  container.appendChild(outer);
}

function renderHelperError(container, msg, hint) {
  container.textContent = '';
  const outer = document.createElement('div');
  outer.className = 'hresult';
  const p = document.createElement('p'); p.className = 'err'; p.textContent = msg;
  outer.appendChild(p);
  if (hint) {
    const p2 = document.createElement('p'); p2.className = 'retry-hint'; p2.textContent = hint;
    outer.appendChild(p2);
  }
  container.appendChild(outer);
}
